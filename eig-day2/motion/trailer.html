<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/css/fonts.css">
<style>
  :root {
    --bg: #050a15; --copper: #c98552; --copper-hi: #e8b38a; --copper-lo: #8a4f2b;
    --ink: #f4efe8; --dim: rgba(244, 239, 232, .66); --faint: rgba(244, 239, 232, .4);
    --grad: linear-gradient(100deg, #9a5a32 0%, #e8b38a 42%, #c98552 68%, #7a4424 100%);
    --serif: 'Instrument Serif', Georgia, serif; --sans: 'Inter Tight', system-ui, sans-serif;
  }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }
  .full { position: absolute; inset: 0; }
  .cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  .serif { font-family: var(--serif); font-weight: 400; color: var(--ink); letter-spacing: -.015em; line-height: 1; }
  .sans { font-family: var(--sans); color: var(--ink); }
  .cop { color: var(--copper-hi); font-style: italic; }
  .gradtext { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kick { font: 600 22px/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--copper-hi); white-space: nowrap; }
  .w { display: inline-block; white-space: nowrap; }
  .tag { position: absolute; left: 120px; bottom: 96px; display: flex; align-items: center; gap: 18px; }
  .tag .av { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px rgba(232, 179, 138, .6); }
  .tag .av img { width: 100%; height: 100%; object-fit: cover; }
  .tag b { display: block; font: 600 26px/1.1 var(--sans); color: var(--ink); }
  .tag span { display: block; font: 400 19px/1.3 var(--sans); color: var(--dim); margin-top: 4px; }
  .tag .bar { width: 3px; align-self: stretch; background: linear-gradient(180deg, #e8b38a, #8a4f2b); }
  .card { position: absolute; width: 760px; height: 427px; border-radius: 18px; overflow: hidden; background: #0b1424;
          box-shadow: 0 40px 90px rgba(0, 0, 0, .55), 0 0 0 1px rgba(232, 179, 138, .22); transform-style: preserve-3d; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip { position: absolute; left: 18px; top: 18px; padding: 9px 14px 8px; border-radius: 99px; background: rgba(5, 10, 21, .86);
          font: 600 15px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--copper-hi); box-shadow: inset 0 0 0 1px rgba(232, 179, 138, .4); }
  .tile { position: absolute; width: 196px; height: 196px; border-radius: 16px; overflow: hidden; background: #0e1a2e; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.mono { display: grid; place-items: center; background: radial-gradient(120% 120% at 30% 20%, rgba(232, 179, 138, .25), rgba(12, 24, 44, .95) 70%); }
  .tile.mono span { font: 400 64px/1 var(--serif); color: var(--copper-hi); }
  .pill { display: inline-flex; align-items: center; gap: 14px; padding: 0 40px; height: 86px; border-radius: 99px; background: var(--grad);
          font: 600 32px/1 var(--sans); color: #1a0f07; box-shadow: 0 20px 50px rgba(201, 133, 82, .35); }
  .stchip { display: inline-block; padding: 14px 22px 13px; border-radius: 99px; font: 500 24px/1 var(--sans); color: var(--ink);
            box-shadow: inset 0 0 0 1px rgba(232, 179, 138, .45); background: rgba(5, 10, 21, .55); }
  svg { position: absolute; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../site/data/talks.js"></script>
<script src="trailer.js"></script>
</body>
</html>
