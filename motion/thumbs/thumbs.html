<!doctype html>
<!-- YouTube thumbnails (1280x720) for the SCIA 2026 films. Render: node thumbs/render-thumbs.mjs -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/barlow-condensed/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/700.css">
<style>
  :root { --bg: #050d1d; --red: #e3243b; --white: #f5f7fb; --sky: #8fb6ff; }
  html, body { margin: 0; background: #000; }
  .t { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  .abs { position: absolute; }
  .D { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; line-height: .84; color: var(--white);
       white-space: nowrap; letter-spacing: -.01em; }
  .badge { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: #fff;
           background: var(--red); padding: 10px 18px 9px; border-radius: 6px; }
  .tile { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  .tile > div { position: absolute; background-position: center; background-size: contain; background-repeat: no-repeat; mix-blend-mode: multiply; }
  .shadow { text-shadow: 0 8px 30px rgba(0,0,0,.6); }
</style>
</head>
<body>

<!-- FINALISTS -->
<div class="t" id="finalists">
  <img class="abs" src="../assets/clipB/0060.jpg" style="left:-60px;top:-30px;width:1400px;filter:saturate(.8) brightness(.8)">
  <div class="abs" style="inset:0;background:linear-gradient(100deg, rgba(5,13,29,.97) 0%, rgba(5,13,29,.86) 44%, rgba(5,13,29,.35) 75%, rgba(5,13,29,.55) 100%)"></div>
  <div class="abs" style="inset:0;background:linear-gradient(to top, rgba(5,13,29,.95) 0%, rgba(5,13,29,0) 38%)"></div>
  <div class="abs badge" style="left:56px;top:46px">SCIA 2026</div>
  <div class="abs D shadow" style="left:50px;top:118px;font-size:200px"><span style="color:var(--red)">5</span> Finalists.</div>
  <div class="abs D shadow" style="left:50px;top:290px;font-size:200px"><span style="color:var(--red)">1</span> Winner.</div>
  <div class="abs" style="left:56px;top:470px;width:250px;height:10px;background:var(--red)"></div>
  <div id="row" class="abs" style="left:50px;top:530px;width:1180px;height:136px"></div>
</div>

<!-- WINNERS -->
<div class="t" id="winners">
  <img class="abs" src="../assets/winners/gofo-award.jpg" style="left:-150px;top:-215px;width:2200px;filter:saturate(1.08) contrast(1.05)">
  <!-- light on the trophy -->
  <div class="abs" style="left:780px;top:250px;width:420px;height:420px;border-radius:50%;mix-blend-mode:screen;
       background:radial-gradient(circle, rgba(255,240,210,.55) 0%, rgba(255,200,120,.18) 35%, rgba(255,200,120,0) 70%)"></div>
  <div class="abs" style="inset:0;background:linear-gradient(90deg, rgba(5,13,29,.97) 0%, rgba(5,13,29,.9) 34%, rgba(5,13,29,.45) 52%, rgba(5,13,29,0) 66%)"></div>
  <div class="abs" style="inset:0;background:linear-gradient(to top, rgba(5,13,29,.7) 0%, rgba(5,13,29,0) 30%)"></div>
  <div class="abs badge" style="left:56px;top:46px">SCIA 2026</div>
  <div class="abs tile" style="left:56px;top:122px;width:500px;height:170px;transform:rotate(-2.5deg);box-shadow:0 18px 40px rgba(0,0,0,.55), 0 0 0 6px var(--red)">
    <div style="left:52px;right:52px;top:38px;bottom:38px;background-image:url(../assets/logo_gofo.jpg)"></div>
  </div>
  <div class="abs D shadow" style="left:48px;top:322px;font-size:270px">Wins</div>
  <div class="abs D" style="left:56px;top:560px;font-size:46px;color:var(--sky);letter-spacing:.02em;line-height:1.05">Supply Chain<br>Innovation Award<sup style="font-size:.4em;vertical-align:top">™</sup></div>
</div>

<script>
const FIN = [['logo_intel.jpg', .22, .2], ['logo_gofo.jpg', .12, .3], ['logo_intel.jpg', .22, .2], ['logo_gp.jpg', .26, .06], ['logo_reliance.png', .2, .05]];
const row = document.getElementById('row'), W = 206, H = 124, G = 18; // ends left of YouTube's timestamp badge
FIN.forEach(([f, px, py], i) => {
  const t = document.createElement('div'); t.className = 'abs tile';
  Object.assign(t.style, { left: i * (W + G) + 'px', top: '0', width: W + 'px', height: H + 'px', transform: `rotate(${(i - 2) * 1.2}deg)` });
  const l = document.createElement('div');
  Object.assign(l.style, { left: W * px + 'px', right: W * px + 'px', top: H * py + 'px', bottom: H * py + 'px', backgroundImage: `url(../assets/${f})` });
  t.appendChild(l); row.appendChild(t);
});
</script>
</body>
</html>
